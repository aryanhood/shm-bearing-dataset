name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install PyTorch CPU and package
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch
          pip install -e ".[train,dev]"

      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .

      - name: Type check (mypy --strict)
        run: mypy

      - name: Tests and coverage
        run: pytest --cov=orderguard

  edge-runtime:
    name: Edge Runtime (No PyTorch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install edge-only package
        run: pip install -e .

      - name: Verify ONNX edge inference without PyTorch
        run: |
          python -c "from pathlib import Path; import numpy as np; from orderguard.edge import EdgeClassifier; e = EdgeClassifier(Path('artifacts/orderguard.onnx'), Path('artifacts/model_meta.json')); p = e.predict_proba(np.zeros((1, 4, 400), dtype=np.float32)); assert p.shape == (1, 5); print('edge ok:', p.round(4))"
