[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orderguard"
version = "0.1.0"
description = "Encoder-locked Computed Order Tracking, ONNX edge diagnostics, and supervisory derating for variable-speed actuators."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "onnxruntime>=1.18",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
train = [
  "torch>=2.2",
  "onnx>=1.16",
  "onnxscript>=0.1",
  "scikit-learn>=1.4",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
orderguard = "orderguard.cli:main"

[tool.setuptools.packages.find]
include = ["orderguard*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["orderguard", "tests"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
